<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chess 3D · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806; --card:rgba(20,14,8,.95); --panel:rgba(16,10,6,.98);
    --accent:#c9a84c; --accent2:#7a6230;
    --text:#f0e6ce; --muted:#6b5f4e; --border:rgba(201,168,76,.22);
    --danger:#cc0000; --success:#2ed573;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Cormorant Garamond','Cinzel',serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:16px;position:relative;overflow-y:auto;
    -webkit-font-smoothing:antialiased;
  }
  .bg-glow{position:fixed;inset:0;z-index:0}
  .bg-glow::before,.bg-glow::after{
    content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:0.12;
  }
  .bg-glow::before{width:500px;height:500px;background:var(--accent);top:-20%;left:-10%}
  .bg-glow::after{width:400px;height:400px;background:var(--accent);bottom:-20%;right:-10%;opacity:0.06}

  .container{
    position:relative;z-index:1;width:100%;max-width:440px;
    background:rgba(16,10,6,.70);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:4px;padding:32px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);margin:20px 0;
  }
  .tabs{display:flex;gap:0;margin-bottom:28px;background:var(--panel);border-radius:4px;padding:4px}
  .tab-btn{
    flex:1;padding:10px;border:none;background:transparent;
    color:var(--muted);font-size:15px;font-weight:600;
    border-radius:4px;cursor:pointer;transition:all .25s ease;
    font-family:'Cinzel',serif;letter-spacing:.05em;text-transform:uppercase;
  }
  .tab-btn.active{background:var(--accent);color:#0a0806;box-shadow:0 4px 12px rgba(201,168,76,.3)}
  .forms-wrapper{overflow:hidden;position:relative}
  .forms-slider{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .form-panel{min-width:100%;padding:0 2px}
  .form-panel h2{font-family:'Cinzel',serif;font-size:22px;font-weight:700;margin-bottom:20px;text-align:center;color:var(--accent);letter-spacing:.1em}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:'Cinzel',serif;font-size:10px;color:var(--accent2);margin-bottom:6px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
  .field input,.field select{
    width:100%;padding:12px 14px;border-radius:4px;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:16px;outline:none;
    transition:border-color .15s;font-family:'Cormorant Garamond',serif;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field input.invalid-age{border-color:var(--danger)!important;color:var(--danger)!important}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:48px}
  .pwd-wrap .reveal{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);cursor:pointer;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  }
  .pwd-wrap .reveal svg{width:22px;height:22px;fill:currentColor}
  .submit-btn{
    width:100%;padding:14px;border:none;border-radius:4px;
    background:var(--accent);color:#0a0806;font-size:15px;font-weight:700;
    cursor:pointer;transition:filter .15s;margin-top:8px;
    font-family:'Cinzel',serif;letter-spacing:.1em;text-transform:uppercase;
  }
  .submit-btn:disabled{opacity:0.6;cursor:not-allowed}
  .submit-btn:hover:not(:disabled){filter:brightness(1.08)}
  .err-msg{font-family:'Cinzel',serif;font-size:12px;color:var(--danger);margin-top:8px;display:none}
  .err-msg.show{display:block}
  .success-msg{font-family:'Cinzel',serif;font-size:12px;color:var(--accent);margin-top:8px;display:none}
  .success-msg.show{display:block}
  .age-error-text{font-family:'Cinzel',serif;font-size:11px;color:var(--danger);margin-top:4px;display:none}
  .age-error-text.show{display:block}
  .switch-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
  .switch-link button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font:inherit}
  .back-link{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:24px;font-size:14px;color:var(--muted);text-decoration:none;
    transition:color .15s;font-family:'Cinzel',serif;letter-spacing:.05em;
  }
  .back-link:hover{color:var(--text)}
  .back-link svg{width:20px;height:20px;fill:currentColor}
  .forgot-link{display:block;text-align:right;margin-top:8px}
  .forgot-link a{font-size:12px;color:var(--muted);text-decoration:underline}
  .forgot-link a:hover{color:var(--text)}
  .dob-row{display:flex;gap:8px}
  .dob-row select{flex:1;padding:12px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:16px;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b5f4e'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:30px;font-family:'Cormorant Garamond',serif}
  .dob-row select:focus{border-color:var(--accent)}

  .google-divider {
    display: flex; align-items: center; text-align: center;
    margin: 16px 0; color: var(--muted);
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.1em;
  }
  .google-divider::before, .google-divider::after {
    content: ''; flex: 1; border-bottom: 1px dashed rgba(201, 168, 76, 0.15);
  }
  .google-divider:not(:empty)::before { margin-right: .5em; }
  .google-divider:not(:empty)::after { margin-left: .5em; }

  .google-btn {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 4px; background: transparent; color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .2s ease; font-family: 'Cinzel', serif;
    letter-spacing: .05em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .google-btn:hover {
    background: rgba(201, 168, 76, 0.08); border-color: var(--accent);
    box-shadow: 0 0 15px rgba(201, 168, 76, 0.1);
  }
  .google-btn svg { display: block; }

  .onboarding-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(4,2,1,0.8); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .onboarding-overlay.hidden { display: none; }

  .onboarding-card {
    width: 100%; max-width: 420px;
    background: rgba(20,14,8,0.9); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 28px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    text-align: center; animation: goin .3s cubic-bezier(.175,.885,.32,1.275);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes goin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .onboarding-card h2 {
    font-family: 'Cinzel', serif; font-size: 20px;
    color: var(--accent); letter-spacing: .1em; margin-bottom: 12px;
  }
  .onboarding-card p { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 20px; }
  .onboarding-card .field { margin-bottom: 14px; }
  .onboarding-card .field input, .onboarding-card .field select { text-align: left; font-size: 16px; }
  .onboarding-card .field input[readonly] { opacity: 0.8; cursor: default; }
  .onboarding-card .submit-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;
  }
  .onboarding-card .err-msg, .onboarding-card .success-msg { margin-top: 12px; font-size: 12px; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-spinner{
    width:18px;height:18px;border:2px solid transparent;
    border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;
    display:inline-block;
  }
  #native-badge {
    position:fixed;bottom:8px;right:8px;z-index:999;
    background:rgba(0,0,0,.7);color:#c9a84c;
    font-family:monospace;font-size:10px;padding:4px 8px;border-radius:4px;
    pointer-events:none;
  }
  /* Visual debug log */
  #debug-log {
    position:fixed;bottom:40px;left:10px;right:10px;z-index:9999;
    background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:10px;
    padding:8px;border-radius:4px;max-height:250px;overflow-y:auto;
    white-space:pre-wrap;word-break:break-all;pointer-events:none;
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="native-badge">native: checking…</div>

  <!-- Visual debug log (shows OAUTH events right on screen) -->
  <div id="debug-log">[LOG] Waiting for Google Sign‑in...</div>

  <div class="container" id="loginContainer">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">Log in</button>
      <button class="tab-btn" id="tabSignup">Sign up</button>
    </div>
    <div class="forms-wrapper">
      <div class="forms-slider" id="slider">

        <div class="form-panel" id="loginPanel">
          <h2>Welcome back</h2>
          <div class="field">
            <label for="loginUsername">Username</label>
            <input id="loginUsername" type="text" autocomplete="username" placeholder="Your username" />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="pwd-wrap">
              <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="reveal" data-target="loginPassword">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </button>
            </div>
          </div>
          <div class="forgot-link"><a href="forgot_password.html">Forgot password?</a></div>
          <div class="err-msg" id="loginErr"></div>
          <button class="submit-btn" id="loginSubmit">Log in</button>

          <div class="google-divider"><span>OR</span></div>
          <button type="button" class="google-btn" id="googleSubmit">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
          </button>

          <div class="switch-link">
            Don't have an account? <button id="switchToSignup">Sign up</button>
          </div>
        </div>

        <div class="form-panel" id="signupPanel">
          <h2>Create account</h2>
          <div class="field">
            <label for="signupFirstName">First name</label>
            <input id="signupFirstName" type="text" autocomplete="given-name" placeholder="First name" />
          </div>
          <div class="field">
            <label for="signupLastName">Last name</label>
            <input id="signupLastName" type="text" autocomplete="family-name" placeholder="Last name" />
          </div>
          <div class="field">
            <label>Date of birth</label>
            <div class="dob-row">
              <select id="dobDay"><option value="">Day</option></select>
              <select id="dobMonth"><option value="">Month</option></select>
              <select id="dobYear"><option value="">Year</option></select>
            </div>
          </div>
          <div class="field">
            <label for="signupAge">Age (auto‑calculated)</label>
            <input id="signupAge" type="text" readonly placeholder="From date of birth" />
            <div class="age-error-text" id="ageError"></div>
          </div>
          <div class="field">
            <label for="signupCountry">Country</label>
            <input id="signupCountry" type="text" placeholder="Your country" />
          </div>
          <div class="field">
            <label for="signupUsername">Username</label>
            <input id="signupUsername" type="text" autocomplete="username" placeholder="Choose a username" />
          </div>
          <div class="field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com" />
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <div class="pwd-wrap">
              <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 chars, 1 letter, 1 number, 1 special" />
              <button type="button" class="reveal" data-target="signupPassword">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </button>
            </div>
          </div>
          <div class="err-msg" id="signupErr"></div>
          <div class="success-msg" id="signupSuccess"></div>
          <button class="submit-btn" id="signupSubmit">Sign up</button>
          <div class="switch-link">
            Already have an account? <button id="switchToLogin">Log in</button>
          </div>
        </div>
      </div>
    </div>
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to Home
    </a>
  </div>

  <div class="onboarding-overlay hidden" id="onboardingOverlay">
    <div class="onboarding-card">
      <h2>Complete your profile</h2>
      <p>You signed in with Google. Before you can play, please fill in the fields below.</p>
      <div class="field">
        <label for="onboardingUsername">Username</label>
        <input type="text" id="onboardingUsername" placeholder="Choose a permanent username" maxlength="30" autocomplete="off" />
      </div>
      <div class="field">
        <label>Date of birth</label>
        <div class="dob-row">
          <select id="onboardingDobDay"><option value="">Day</option></select>
          <select id="onboardingDobMonth"><option value="">Month</option></select>
          <select id="onboardingDobYear"><option value="">Year</option></select>
        </div>
      </div>
      <div class="field">
        <label for="onboardingAge">Age</label>
        <input id="onboardingAge" type="text" readonly placeholder="Calculated from DOB" />
        <div class="age-error-text" id="onboardingAgeError"></div>
      </div>
      <div class="field">
        <label for="onboardingCountry">Country</label>
        <input type="text" id="onboardingCountry" placeholder="Your country" autocomplete="country-name" />
      </div>
      <button class="submit-btn" id="onboardingSubmit">
        <span id="onboardingBtnText">Save profile</span>
      </button>
      <div class="err-msg" id="onboardingErr"></div>
      <div class="success-msg" id="onboardingSuccess"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.ts';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        flowType: 'pkce',
        detectSessionInUrl: false,
        storage: window.localStorage,
      },
    });

    // Visual logger – adds messages to the on‑screen debug box
    function debugLog(msg) {
      const box = document.getElementById('debug-log');
      if (box) {
        const line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        box.textContent += '\n' + line;
        box.scrollTop = box.scrollHeight;
      }
      console.log(msg); // still goes to logcat if available
    }

    const isNative = sessionStorage.getItem('isCapacitorNative') === '1';
    document.getElementById('native-badge').textContent =
      `native: ${isNative} | host: ${window.location.hostname}`;

    debugLog('isNative = ' + isNative);
    debugLog('host = ' + window.location.hostname);

    const $ = id => document.getElementById(id);
    const slider = $("slider");
    const tabLogin = $("tabLogin");
    const tabSignup = $("tabSignup");

    const dobDay = $("dobDay"), dobMonth = $("dobMonth"), dobYear = $("dobYear");
    const signupAge = $("signupAge"), ageError = $("ageError");
    const currentYear = new Date().getFullYear();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    for (let i = 1; i <= 12; i++) { const o = document.createElement("option"); o.value = i; o.textContent = monthNames[i-1]; dobMonth.appendChild(o); }
    for (let y = currentYear; y >= 1900; y--) { const o = document.createElement("option"); o.value = y; o.textContent = y; dobYear.appendChild(o); }
    function getDaysInMonth(m, y) { if (!m || !y) return 31; return new Date(y, m, 0).getDate(); }
    function populateDays() {
      const m = parseInt(dobMonth.value), y = parseInt(dobYear.value), days = getDaysInMonth(m||1, y||2000), cur = dobDay.value ? parseInt(dobDay.value) : 0;
      dobDay.innerHTML = '<option value="">Day</option>';
      for (let d = 1; d <= days; d++) { const o = document.createElement("option"); o.value = d; o.textContent = d; dobDay.appendChild(o); }
      if (cur > 0 && cur <= days) dobDay.value = cur; else dobDay.value = "";
    }
    dobMonth.addEventListener("change", populateDays); dobYear.addEventListener("change", populateDays); populateDays();
    function updateAgeField() {
      const d = parseInt(dobDay.value), m = parseInt(dobMonth.value), y = parseInt(dobYear.value);
      if (!d || !m || !y) { signupAge.value = ""; signupAge.classList.remove("invalid-age"); ageError.classList.remove("show"); return; }
      const dob = new Date(y, m-1, d), now = new Date();
      let age = now.getFullYear() - dob.getFullYear();
      const md = now.getMonth() - dob.getMonth(); if (md < 0 || (md === 0 && now.getDate() < dob.getDate())) age--;
      signupAge.value = age;
      if (age < 14) { signupAge.classList.add("invalid-age"); ageError.textContent = "You must be at least 14 years old."; ageError.classList.add("show"); }
      else { signupAge.classList.remove("invalid-age"); ageError.classList.remove("show"); }
    }
    dobDay.addEventListener("change", updateAgeField); dobMonth.addEventListener("change", updateAgeField); dobYear.addEventListener("change", updateAgeField);

    function switchToLogin() { slider.style.transform = "translateX(0)"; tabLogin.classList.add("active"); tabSignup.classList.remove("active"); clearMessages(); }
    function switchToSignup() { slider.style.transform = "translateX(-100%)"; tabSignup.classList.add("active"); tabLogin.classList.remove("active"); clearMessages(); }
    tabLogin.addEventListener("click", switchToLogin); tabSignup.addEventListener("click", switchToSignup);
    $("switchToSignup").addEventListener("click", switchToSignup); $("switchToLogin").addEventListener("click", switchToLogin);

    document.querySelectorAll(".reveal").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const isPw = input.type === "password";
        input.type = isPw ? "text" : "password";
        btn.querySelector('svg').innerHTML = isPw
          ? '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>'
          : '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
      });
    });

    function clearMessages() {
      $("loginErr").classList.remove("show"); $("signupErr").classList.remove("show"); $("signupSuccess").classList.remove("show");
      signupAge.classList.remove("invalid-age"); ageError.classList.remove("show");
    }
    function isValidPassword(pw) { return pw.length >= 8 && /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw) && /[^a-zA-Z0-9]/.test(pw); }

    $("loginSubmit").addEventListener("click", async function() {
      const btn = this;
      const username = $("loginUsername").value.trim(), password = $("loginPassword").value, err = $("loginErr");
      err.classList.remove("show");
      if (!username || !password) { err.textContent = "Please enter both username and password."; err.classList.add("show"); return; }
      btn.disabled = true; btn.textContent = "Logging in…";
      try {
        const { data: profile } = await supabase.from("profiles").select("email, id").eq("username", username).maybeSingle();
        if (!profile) { err.textContent = "Username does not exist."; err.classList.add("show"); return; }
        const { error: authErr } = await supabase.auth.signInWithPassword({ email: profile.email, password });
        if (authErr) throw authErr;
        await supabase.from("profiles").update({ is_online: true, last_seen: new Date().toISOString() }).eq("id", profile.id);
        window.location.href = "index.html";
      } catch(e) {
        err.textContent = e.message || "Login failed."; err.classList.add("show");
      } finally {
        btn.disabled = false; btn.textContent = "Log in";
      }
    });

    // ── Google Sign‑In with VISUAL DIAGNOSTIC LOGS ──────────────────────────
    let googleAuthInProgress = false;
    let appUrlHandle = null;

    $("googleSubmit").addEventListener("click", async () => {
      if (googleAuthInProgress) return;
      googleAuthInProgress = true;
      const errEl = $("loginErr");
      errEl.classList.remove("show");
      debugLog('[OAUTH] Click – starting sign‑in flow');

      try {
        if (!isNative) {
          debugLog('[OAUTH] Not native – using web redirect');
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/user_login.html?onboarding=1' },
          });
          if (error) throw error;
          googleAuthInProgress = false;
          return;
        }

        debugLog('[OAUTH] Native detected – loading Browser & App plugins');
        sessionStorage.setItem('pendingGoogleAuth', '1');
        debugLog('[OAUTH] Set pendingGoogleAuth=1');

        const [{ Browser }, { App }] = await Promise.all([
          import('@capacitor/browser'),
          import('@capacitor/app')
        ]);
        debugLog('[OAUTH] Plugins loaded');

        appUrlHandle = await App.addListener("appUrlOpen", async (data) => {
          try {
            debugLog('[OAUTH] appUrlOpen fired: ' + data.url);

            if (new URL(data.url).hostname !== "oauth-callback") {
              debugLog('[OAUTH] Ignored – wrong hostname');
              return;
            }

            // Check localStorage verifier
            const verifierKey = "sb-akrxbxzcvnspbmvgdrci-auth-token-code-verifier";
            const verifier = localStorage.getItem(verifierKey);
            debugLog('[OAUTH] Verifier: ' + (verifier ? 'EXISTS (' + verifier.length + ' chars)' : 'MISSING'));
            debugLog('[OAUTH] localStorage keys: ' + Object.keys(localStorage).join(', '));

            appUrlHandle.remove();
            debugLog('[OAUTH] Calling exchangeCodeForSession with URL');

            const { error } = await supabase.auth.exchangeCodeForSession(data.url);
            if (error) {
              debugLog('[OAUTH] Exchange error: ' + error.message + ' (status: ' + error.status + ')');
              throw error;
            }

            debugLog('[OAUTH] Exchange succeeded – checking session');
            const { data: { session } } = await supabase.auth.getSession();
            debugLog('[OAUTH] Session: ' + (session ? 'EXISTS' : 'NULL'));

            if (!session) throw new Error("Session not created after exchange.");
            sessionStorage.removeItem("pendingGoogleAuth");
            debugLog('[OAUTH] Success – redirecting to index.html');
            window.location.href = "index.html";

          } catch (e) {
            debugLog('[OAUTH] CAUGHT ERROR: ' + e.message);
            errEl.textContent = e.message || "Session exchange failed.";
            errEl.classList.add("show");
            sessionStorage.removeItem("pendingGoogleAuth");
            googleAuthInProgress = false;
          }
        });
        debugLog('[OAUTH] appUrlOpen listener added');

        const { data: { url } } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'com.chess3d.mobile://oauth-callback',
            skipBrowserRedirect: true,
          },
        });

        if (!url) throw new Error('Could not get OAuth URL');
        debugLog('[OAUTH] Opening browser with URL: ' + url);
        await Browser.open({ url });

        setTimeout(() => {
          if (googleAuthInProgress) {
            debugLog('[OAUTH] TIMEOUT – no callback received in 120s');
            googleAuthInProgress = false;
            if (appUrlHandle) appUrlHandle.remove();
            sessionStorage.removeItem('pendingGoogleAuth');
            errEl.textContent = 'Sign-in timed out. Please try again.';
            errEl.classList.add('show');
            Browser.close();
          }
        }, 120000);

      } catch (e) {
        debugLog('[OAUTH] Setup error: ' + e.message);
        errEl.textContent = e.message || 'Google authentication failed.';
        errEl.classList.add('show');
        googleAuthInProgress = false;
        sessionStorage.removeItem('pendingGoogleAuth');
        if (appUrlHandle) appUrlHandle.remove();
      }
    });

    // Signup and onboarding code unchanged (same as your previous version)...
    // (keeping the rest identical for brevity – the only change is the debug log)
    $("signupSubmit").addEventListener("click", async () => {
      // ... [full signup code same as before]
      const fn = $("signupFirstName").value.trim(), ln = $("signupLastName").value.trim();
      const country = $("signupCountry").value.trim(), username = $("signupUsername").value.trim();
      const email = $("signupEmail").value.trim(), password = $("signupPassword").value;
      const day = parseInt(dobDay.value), month = parseInt(dobMonth.value), year = parseInt(dobYear.value);
      const err = $("signupErr"), success = $("signupSuccess");
      err.classList.remove("show"); success.classList.remove("show");
      if (!fn||!ln||!country||!username||!email||!password||!day||!month||!year) { err.textContent = "All fields are required."; err.classList.add("show"); return; }
      const age = parseInt(signupAge.value,10); if (isNaN(age)||age<14) { err.textContent = "You must be at least 14 years old."; err.classList.add("show"); return; }
      if (!isValidPassword(password)) { err.textContent = "Password must be 8+ chars with letter, number, special."; err.classList.add("show"); return; }
      const fullName = `${fn} ${ln}`, dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      try {
        const { data: exist } = await supabase.from("profiles").select("id").eq("username", username).maybeSingle();
        if (exist) { err.textContent = "Username already taken."; err.classList.add("show"); return; }
        const { data: auth, error: authErr } = await supabase.auth.signUp({ email, password, options: { data: { username, full_name: fullName }, emailRedirectTo: window.location.origin+"/index.html" } });
        if (authErr) throw authErr;
        if (!auth.user) throw new Error("Signup failed.");
        const { error: insErr } = await supabase.from("profiles").insert({ id: auth.user.id, username, full_name: fullName, age, dob, country, email });
        if (insErr) throw new Error("Profile creation failed: "+insErr.message);
        success.textContent = "Account created! You can now log in."; success.classList.add("show");
        $("signupFirstName").value=$("signupLastName").value=$("signupCountry").value=$("signupUsername").value=$("signupEmail").value=$("signupPassword").value="";
        dobDay.value=dobMonth.value=dobYear.value=""; populateDays(); signupAge.value=""; signupAge.classList.remove("invalid-age"); ageError.classList.remove("show");
      } catch(e) { err.textContent = e.message || "Registration failed."; err.classList.add("show"); }
    });

    document.addEventListener("keydown", (e) => { if (e.key==="Enter") { tabLogin.classList.contains("active") ? $("loginSubmit").click() : $("signupSubmit").click(); } });

    // Onboarding modal (unchanged) ...
    const onboardingOverlay = $("onboardingOverlay");
    const onboardingUsername = $("onboardingUsername");
    const onboardingCountry = $("onboardingCountry");
    const onboardingDobDay = $("onboardingDobDay");
    const onboardingDobMonth = $("onboardingDobMonth");
    const onboardingDobYear = $("onboardingDobYear");
    const onboardingAge = $("onboardingAge");
    const onboardingAgeError = $("onboardingAgeError");
    const onboardingSubmit = $("onboardingSubmit");
    const onboardingBtnText = $("onboardingBtnText");
    const onboardingErr = $("onboardingErr");
    const onboardingSuccess = $("onboardingSuccess");
    const loginContainer = $("loginContainer");

    let onboardingInProgress = false;
    const onboardCurrentYear = new Date().getFullYear();
    for (let i = 1; i <= 12; i++) { const o = document.createElement("option"); o.value = i; o.textContent = monthNames[i-1]; onboardingDobMonth.appendChild(o); }
    for (let y = onboardCurrentYear; y >= 1900; y--) { const o = document.createElement("option"); o.value = y; o.textContent = y; onboardingDobYear.appendChild(o); }
    function populateOnboardingDays() {
      const m = parseInt(onboardingDobMonth.value), y = parseInt(onboardingDobYear.value), days = getDaysInMonth(m||1, y||2000), cur = onboardingDobDay.value ? parseInt(onboardingDobDay.value) : 0;
      onboardingDobDay.innerHTML = '<option value="">Day</option>';
      for (let d = 1; d <= days; d++) { const o = document.createElement("option"); o.value = d; o.textContent = d; onboardingDobDay.appendChild(o); }
      if (cur > 0 && cur <= days) onboardingDobDay.value = cur; else onboardingDobDay.value = "";
    }
    onboardingDobMonth.addEventListener("change", populateOnboardingDays);
    onboardingDobYear.addEventListener("change", populateOnboardingDays);
    populateOnboardingDays();

    function updateOnboardingAge() {
      const d = parseInt(onboardingDobDay.value), m = parseInt(onboardingDobMonth.value), y = parseInt(onboardingDobYear.value);
      if (!d || !m || !y) { onboardingAge.value = ""; onboardingAge.classList.remove("invalid-age"); onboardingAgeError.classList.remove("show"); return; }
      const dob = new Date(y, m-1, d), now = new Date();
      let age = now.getFullYear() - dob.getFullYear();
      const md = now.getMonth() - dob.getMonth(); if (md < 0 || (md === 0 && now.getDate() < dob.getDate())) age--;
      onboardingAge.value = age;
      if (age < 14) { onboardingAge.classList.add("invalid-age"); onboardingAgeError.textContent = "You must be at least 14 years old."; onboardingAgeError.classList.add("show"); }
      else { onboardingAge.classList.remove("invalid-age"); onboardingAgeError.classList.remove("show"); }
    }
    onboardingDobDay.addEventListener("change", updateOnboardingAge);
    onboardingDobMonth.addEventListener("change", updateOnboardingAge);
    onboardingDobYear.addEventListener("change", updateOnboardingAge);

    function showOnboardingModal() {
      onboardingOverlay.classList.remove("hidden");
      loginContainer.style.opacity = "0.3";
      onboardingUsername.value = "";
      onboardingCountry.value = "";
      onboardingDobDay.value = "";
      onboardingDobMonth.value = "";
      onboardingDobYear.value = "";
      onboardingAge.value = "";
      onboardingAge.classList.remove("invalid-age");
      onboardingAgeError.classList.remove("show");
      onboardingErr.classList.remove("show");
      onboardingSuccess.classList.remove("show");
      populateOnboardingDays();
    }

    function hideOnboardingModal() {
      onboardingOverlay.classList.add("hidden");
      loginContainer.style.opacity = "1";
    }

    function showOnboardingError(message) {
      showOnboardingModal();
      onboardingErr.textContent = message;
      onboardingErr.classList.add("show");
      onboardingSubmit.disabled = false;
      onboardingBtnText.textContent = "Save profile";
    }

    onboardingSubmit.addEventListener("click", async () => {
      if (onboardingInProgress) return;
      const username = onboardingUsername.value.trim();
      const country = onboardingCountry.value.trim();
      const day = parseInt(onboardingDobDay.value), month = parseInt(onboardingDobMonth.value), year = parseInt(onboardingDobYear.value);
      onboardingErr.classList.remove("show");
      onboardingSuccess.classList.remove("show");

      if (!username || !country || !day || !month || !year) {
        onboardingErr.textContent = "All fields are required.";
        onboardingErr.classList.add("show");
        return;
      }
      if (username.length < 3) {
        onboardingErr.textContent = "Username must be at least 3 characters.";
        onboardingErr.classList.add("show");
        return;
      }
      const age = parseInt(onboardingAge.value, 10);
      if (isNaN(age) || age < 14) {
        onboardingErr.textContent = "You must be at least 14 years old.";
        onboardingErr.classList.add("show");
        return;
      }

      onboardingInProgress = true;
      onboardingSubmit.disabled = true;
      onboardingBtnText.innerHTML = '<span class="loading-spinner"></span> Saving…';

      try {
        const { data: existing } = await supabase.from("profiles").select("id").eq("username", username).maybeSingle();
        if (existing) { onboardingErr.textContent = "This username is already taken. Please choose another."; onboardingErr.classList.add("show"); return; }

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error("Session expired. Please refresh the page.");

        const dob = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const { error: updateError } = await supabase.from("profiles").update({ username, age, dob, country }).eq("id", session.user.id);
        if (updateError) throw updateError;

        onboardingSuccess.textContent = `Welcome, ${username}! Redirecting to the game…`;
        onboardingSuccess.classList.add("show");
        onboardingBtnText.innerHTML = "Done!";

        setTimeout(() => { hideOnboardingModal(); window.location.href = "index.html"; }, 3000);
      } catch (e) {
        onboardingErr.textContent = e.message || "An error occurred. Please try again.";
        onboardingErr.classList.add("show");
      } finally {
        onboardingInProgress = false;
        onboardingSubmit.disabled = false;
        onboardingBtnText.textContent = "Save profile";
      }
    });

    (async function checkOnboarding() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("onboarding") === "1") {
          let { data: profile } = await supabase.from("profiles")
            .select("username, dob, country, email, full_name, avatar_url")
            .eq("id", session.user.id).maybeSingle();

          if (!profile) {
            const user = session.user;
            const fullName = user.user_metadata?.full_name || user.user_metadata?.name || '';
            const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';

            const { error: insertError } = await supabase.from("profiles").insert({
              id: user.id, email: user.email, full_name: fullName, avatar_url: avatar,
            });

            if (insertError) {
              showOnboardingError("Profile creation failed: " + (insertError.message || "Unknown error"));
              return;
            }

            const { data: newProfile } = await supabase.from("profiles")
              .select("username, dob, country, email, full_name, avatar_url")
              .eq("id", user.id).maybeSingle();
            profile = newProfile;
          }

          if (!profile) {
            showOnboardingError("Profile still missing after creation. Please try again.");
            return;
          }

          if (profile.username && profile.dob && profile.country) {
            window.location.href = "index.html";
            return;
          }

          showOnboardingModal();
        }
      } catch (e) {
        showOnboardingError(e.message || "Onboarding check failed.");
      }
    })();
  </script>
</body>
