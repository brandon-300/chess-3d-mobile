workflows:
  android-debug:
    name: Android Debug Build
    # Removed node versioning to prevent installation errors
    environment:
      # If you specifically need a certain version, uncomment the next line
      # node: 20 
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
