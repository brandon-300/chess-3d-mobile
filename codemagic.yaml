workflows:
  android-debug:
    name: Android Debug Build
    # Removed instance_type to let Codemagic select the default allowed machine
    environment:
  node: 20  # Try changing from v20.x to 20 or 18
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
