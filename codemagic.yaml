workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 60
    environment:
      node: v18
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: |
          cd $BITRISE_SOURCE_DIR
          npm install
      - name: Build web assets
        script: |
          cd $BITRISE_SOURCE_DIR
          npm run build
      - name: Sync Capacitor
        script: |
          cd $BITRISE_SOURCE_DIR
          npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/**/*.apk
