name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Android SDK ─────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Node 20 ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 4.5 Remove outdated lockfile ──────────────────────────────────
      - name: Remove old lockfile
        run: rm -f package-lock.json

      # ── 5. Install npm dependencies ────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 6. Build web app ───────────────────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      # ── 7. Add Android platform ────────────────────────────────────────
      - name: Add Capacitor Android platform
        run: |
          rm -rf android/
          npx cap add android 2>/dev/null || npx cap sync android

      # ── 8. Configure native Google Sign‑In (strings.xml) ───────────────
      - name: Add Google Sign‑In server client ID
        run: |
          echo '<string name="server_client_id">573916642453-ec37akr403j0n995le7ip62bs7cfblo2.apps.googleusercontent.com</string>' >> android/app/src/main/res/values/strings.xml

      # ── 9. Configure native Google Sign‑In (build.gradle) ─────────────
      - name: Add Google Sign‑In dependency
        run: |
          sed -i "/dependencies {/a\    implementation 'com.google.android.gms:play-services-auth:20.7.0'" android/app/build.gradle

      # ── 10. Register deep‑link scheme for OAuth ────────────────────────
      - name: Add chess3d:// intent filter to Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          FILTER='            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="chess3d" android:host="oauth" />\n            </intent-filter>'
          sed -i "s|</activity>|${FILTER}\n        </activity>|" "$MANIFEST"
          echo "--- Manifest after patch ---"
          cat "$MANIFEST"

      # ── 11. Copy custom app icons ──────────────────────────────────────
      - name: Copy custom app icons
        run: |
          cp assets/android-icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/android-icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp assets/android-icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ── 12. Sync web assets ────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 13. Make Gradle wrapper executable ─────────────────────────────
      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # ── 14. Build debug APK ────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 15. Upload APK artifact ────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14