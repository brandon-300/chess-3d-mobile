name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Android SDK ─────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Node 20 ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 5. Remove outdated lockfile ──────────────────────────────────
      - name: Remove old lockfile
        run: rm -f package-lock.json

      # ── 6. Install npm dependencies ────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 7. Build web app ───────────────────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      # ── 8. Add Android platform ────────────────────────────────────────
      - name: Add Capacitor Android platform
        run: |
          rm -rf android/
          npx cap add android 2>/dev/null || npx cap sync android

      # ── 9. Configure native Google Sign‑In (strings.xml) ───────────────
      - name: Add Google Sign‑In server client ID
        run: |
          sed -i 's|</resources>|    <string name="server_client_id">573916642453-eikeo4g465eei6meea6ith8oj4a69eeg.apps.googleusercontent.com</string>\n</resources>|' android/app/src/main/res/values/strings.xml

      # ── 10. Configure native Google Sign‑In (build.gradle) ─────────────
      - name: Add Google Sign‑In dependency
        run: |
          sed -i "/dependencies {/a\    implementation 'com.google.android.gms:play-services-auth:20.7.0'" android/app/build.gradle

      # ── 11. Configure signing in build.gradle ──────────────────────────
      - name: Configure signing in build.gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "android.signingConfigs {" >> android/app/build.gradle
          echo "    stableDebug {" >> android/app/build.gradle
          echo '        storeFile file(System.getenv("KEYSTORE_PATH") ?: "")' >> android/app/build.gradle
          echo '        storePassword System.getenv("KEYSTORE_PASS") ?: ""' >> android/app/build.gradle
          echo '        keyAlias System.getenv("KEY_ALIAS") ?: ""' >> android/app/build.gradle
          echo '        keyPassword System.getenv("KEY_PASS") ?: ""' >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "android.buildTypes.debug.signingConfig = android.signingConfigs.stableDebug" >> android/app/build.gradle

      # ── 12. Add com.chess3d.mobile:// intent filter ────────────────────
      - name: Add com.chess3d.mobile:// intent filter to Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          FILTER='            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.chess3d.mobile" android:host="oauth-callback" />\n            </intent-filter>'
          sed -i "s|</activity>|${FILTER}\n        </activity>|" "$MANIFEST"
          echo "--- Manifest after patch ---"
          cat "$MANIFEST"

      # ── 13. Clean BrowserControllerActivity intent filter ─────────────
      - name: Clean BrowserControllerActivity intent filter
        run: |
          sed -i '/BrowserControllerActivity/,/<\/activity>/s/<data android:scheme="com.chess3d.mobile"[^>]*>//g' android/app/src/main/AndroidManifest.xml

      # ── 14. Copy custom app icons ──────────────────────────────────────
      - name: Copy custom app icons
        run: |
          cp assets/android-icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/android-icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/android-icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp assets/android-icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp assets/android-icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ── 15. Set up signing keystore ────────────────────────────────────
      - name: Set up signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/chess3d.keystore
          echo "--- SHA1 of release keystore ---"
          keytool -list -v -keystore android/app/chess3d.keystore \
            -alias chess3d -storepass chess3d123 | grep SHA1

      # ── 16. Capacitor sync ────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 17. Make Gradle wrapper executable ─────────────────────────────
      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # ── 18. Build debug APK ────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: chess3d.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      # ── 19. Upload APK artifact ────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14