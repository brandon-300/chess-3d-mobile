name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch: # also triggerable manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Gradle / Android SDK) ─────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Android SDK ─────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Node 20 ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 5. Install npm dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build web app (Vite → dist/) ───────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      # ── 7. Add Android platform (generates the android/ folder) ───────────
      - name: Add Capacitor Android platform
        run: npx cap add android

      # ── 8. Sync web assets into Android project ────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 9. Make Gradle wrapper executable ─────────────────────────────────
      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # ── 10. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 11. Upload APK as downloadable artifact ────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14